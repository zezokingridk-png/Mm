<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KING 👑</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080b10;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000;z-index:5}.top{display:flex;justify-content:space-between;padding:12px}.box{background:#10151bcc;border:1px solid #fff3;border-radius:14px;padding:9px 12px}.title{font-weight:900;font-size:20px}.stats{display:flex;gap:8px}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(#0009,#000d),radial-gradient(circle at 50% 35%,#26384d,#080b10);display:flex;align-items:center;justify-content:center;color:#fff}.card{width:min(420px,88vw);padding:30px;border:1px solid #ffffff22;border-radius:26px;background:#10151fee;text-align:center;box-shadow:0 20px 70px #000}.logo{font-size:58px;font-weight:1000}.sub{opacity:.8;margin:8px 0 24px}#play{width:100%;padding:15px;border:0;border-radius:15px;background:#d9ad27;color:#111;font-size:19px;font-weight:900}
#controls{position:fixed;left:0;right:0;bottom:18px;z-index:8;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:12px;pointer-events:auto}.btn{width:68px;height:68px;border-radius:50%;border:1px solid #fff4;background:#0b0f16b8;color:#fff;font-size:25px;backdrop-filter:blur(6px);user-select:none}.gas{width:82px;height:82px;background:#d9ad27;color:#111}.small{width:58px;height:58px;font-size:18px}
#mission{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#111b;padding:8px 14px;border-radius:12px;z-index:7;display:none;color:#fff}.hide{display:none!important}
</style>
</head>
<body>
<div id="start"><div class="card"><div class="logo">KING 👑</div><div class="sub">KING v1 — Open Road</div><p>نسخة Web قوية كبداية: قيادة 3D، مدينة، مرور، كاميرا وتحكم للموبايل.</p><button id="play">ابدأ اللعب</button></div></div>
<div id="ui"><div class="top"><div class="box title">👑 KING</div><div class="stats"><div class="box">سرعة <b id="spd">0</b></div><div class="box">💰 <b id="money">5000</b></div></div></div></div>
<div id="mission">🏁 اتجه إلى نقطة السباق</div>
<div id="controls"><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn small" id="cam">🎥</button><button class="btn small" id="brake">🛑</button><button class="btn gas" id="gas">▲</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86c7ed); scene.fog=new THREE.Fog(0x86c7ed,80,360);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,600); camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfeaff,0x405030,2.2)); const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-80,120,50);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x4f9b45));ground.rotation.x=-Math.PI/2;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(30,700),mat(0x34383d));road.rotation.x=-Math.PI/2;road.position.y=.01;scene.add(road);
for(let z=-330;z<350;z+=14){const l=new THREE.Mesh(new THREE.BoxGeometry(.35,.035,6),mat(0xf4f4f4));l.position.set(0,.04,z);scene.add(l)}
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(let z=-320;z<320;z+=24){let side=(Math.floor((z+320)/24)%2?1:-1); box(8+Math.random()*9,8+Math.random()*18,14,0x8a7766,side*(27+Math.random()*12),0,z); if(Math.random()>.3) box(4,12,4,0x4b6f4b,side*(16+Math.random()*6),0,z+7)}
function tree(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,4),mat(0x5a3824));t.position.set(x,2,z);scene.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,8),mat(0x176b35));c.position.set(x,5,z);scene.add(c)}
for(let z=-320;z<320;z+=18){tree(-20-Math.random()*8,z+Math.random()*5);tree(20+Math.random()*8,z+Math.random()*5)}
function car(color=0xd4ad2c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.7,.8,5),mat(color));body.position.y=1;body.castShadow=true;g.add(body);const top=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,2.3),mat(0x172838));top.position.set(0,1.62,-.15);g.add(top);for(const x of[-1.15,1.15])for(const z of[-1.65,1.65]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.22,16),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,.55,z);g.add(w)}return g}
const player=car();player.position.set(0,0,40);scene.add(player);
const traffic=[];for(let i=0;i<10;i++){const c=car([0x1c66c7,0xd92727,0xe8e8e8,0x151515][i%4]);c.scale.setScalar(.85);c.position.set((i%3-1)*7,0,-25-i*35);c.userData.speed=7+(i%4)*2;scene.add(c);traffic.push(c)}
let running=false,keys={},speed=0,camMode=0,last=performance.now(),money=5000;
const spd=document.getElementById('spd'),moneyEl=document.getElementById('money');
function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=0))}hold('left','left');hold('right','right');hold('gas','gas');hold('brake','brake');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='ArrowUp')keys.gas=1;if(e.key==='ArrowDown')keys.brake=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='ArrowUp')keys.gas=0;if(e.key==='ArrowDown')keys.brake=0});
document.getElementById('cam').onclick=()=>camMode=(camMode+1)%2;
document.getElementById('play').onclick=()=>{running=true;document.getElementById('start').classList.add('hide');document.getElementById('mission').style.display='block';last=performance.now();requestAnimationFrame(loop)};
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;if(keys.gas)speed=Math.min(speed+dt*28,55);else speed=Math.max(speed-dt*9,0);if(keys.brake)speed=Math.max(speed-dt*45,0);if(keys.left)player.position.x-=dt*(5+speed*.08);if(keys.right)player.position.x+=dt*(5+speed*.08);player.position.x=Math.max(-11,Math.min(11,player.position.x));player.position.z-=speed*dt;
traffic.forEach(c=>{c.position.z+=c.userData.speed*dt;if(c.position.z>player.position.z+40){c.position.z=player.position.z-250-Math.random()*150;c.position.x=(Math.floor(Math.random()*3)-1)*7}});
if(camMode===0){camera.position.lerp(new THREE.Vector3(player.position.x,5.3,player.position.z+10),.09);camera.lookAt(player.position.x,1,player.position.z-12)}else{camera.position.lerp(new THREE.Vector3(player.position.x,2.1,player.position.z-1),.15);camera.lookAt(player.position.x,1.6,player.position.z-30)}
spd.textContent=Math.round(speed*3.6);renderer.render(scene,camera);requestAnimationFrame(loop)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
